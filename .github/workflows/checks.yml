name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/smoke_demo.py
      - name: Verify exact diagnostic artifact
        run: |
          python scripts/research_diagnostics.py --output /tmp/coms6113-diagnostics.json
          diff results/diagnostics-2026-09-23.json /tmp/coms6113-diagnostics.json
      - run: python scripts/download_papers.py --check-manifest
