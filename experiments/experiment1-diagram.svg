<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">Experiment 1: cost-aware search over retry-aware solver rows</title>
  <desc id="desc">A response matrix with 27 ordered solver rows, 20 search questions and 10 hidden audit questions, next to a three-attempt solver and verifier workflow.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#314158" flood-opacity="0.16"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#36506b"/>
    </marker>
    <marker id="arrowTeal" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M0,0 L12,6 L0,12 z" fill="#168f88"/>
    </marker>
    <style>
      .title { font: 700 34px 'Trebuchet MS', Arial, sans-serif; fill: #20334b; }
      .subtitle { font: 400 18px 'Trebuchet MS', Arial, sans-serif; fill: #52657c; }
      .panelTitle { font: 700 23px 'Trebuchet MS', Arial, sans-serif; fill: #20334b; }
      .label { font: 600 16px 'Trebuchet MS', Arial, sans-serif; fill: #2f4762; }
      .small { font: 400 14px 'Trebuchet MS', Arial, sans-serif; fill: #52657c; }
      .tiny { font: 400 12px 'Trebuchet MS', Arial, sans-serif; fill: #52657c; }
      .cell { font: 600 12px 'Trebuchet MS', Arial, sans-serif; fill: #29425e; }
      .white { fill: #fff; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#fffdf7"/>
  <path d="M0 118 C300 105 520 128 800 114 S1300 124 1600 110" stroke="#d8eee8" stroke-width="24" fill="none" opacity="0.8"/>
  <text x="70" y="70" class="title">Experiment 1 · Retry-aware model selection</text>
  <text x="72" y="101" class="subtitle">Find one good row without paying to measure every row on every question.</text>

  <!-- Matrix panel -->
  <rect x="55" y="150" width="870" height="510" rx="24" fill="#ffffff" stroke="#d4dfe8" stroke-width="2" filter="url(#shadow)"/>
  <text x="85" y="190" class="panelTitle">The response matrix</text>
  <text x="85" y="218" class="small">Each cell is one complete workflow on one question.</text>

  <!-- matrix labels -->
  <rect x="87" y="250" width="365" height="42" rx="10" fill="#d9f1e8"/>
  <text x="104" y="277" class="label">20 search questions · visible gradually</text>
  <rect x="453" y="250" width="310" height="42" rx="10" fill="#ffe7bd"/>
  <text x="476" y="277" class="label">10 audit questions · hidden</text>
  <rect x="765" y="250" width="125" height="42" rx="10" fill="#eef2f5"/>
  <text x="786" y="277" class="label">result</text>

  <!-- matrix grid -->
  <rect x="87" y="304" width="803" height="284" rx="8" fill="#f7fafb" stroke="#9eb1c2" stroke-width="2"/>
  <line x1="250" y1="304" x2="250" y2="588" stroke="#9eb1c2" stroke-width="2"/>
  <line x1="453" y1="304" x2="453" y2="588" stroke="#168f88" stroke-width="3"/>
  <line x1="763" y1="304" x2="763" y2="588" stroke="#d58c2b" stroke-width="3"/>
  <line x1="87" y1="346" x2="890" y2="346" stroke="#9eb1c2" stroke-width="2"/>
  <line x1="87" y1="388" x2="890" y2="388" stroke="#d5e0e7"/>
  <line x1="87" y1="430" x2="890" y2="430" stroke="#d5e0e7"/>
  <line x1="87" y1="472" x2="890" y2="472" stroke="#d5e0e7"/>
  <line x1="87" y1="514" x2="890" y2="514" stroke="#d5e0e7"/>
  <line x1="87" y1="556" x2="890" y2="556" stroke="#d5e0e7"/>
  <line x1="250" y1="346" x2="250" y2="588" stroke="#9eb1c2" stroke-width="2"/>
  <line x1="292" y1="346" x2="292" y2="588" stroke="#d5e0e7"/>
  <line x1="334" y1="346" x2="334" y2="588" stroke="#d5e0e7"/>
  <line x1="376" y1="346" x2="376" y2="588" stroke="#d5e0e7"/>
  <line x1="418" y1="346" x2="418" y2="588" stroke="#d5e0e7"/>
  <line x1="495" y1="346" x2="495" y2="588" stroke="#f0d3a1"/>
  <line x1="537" y1="346" x2="537" y2="588" stroke="#f0d3a1"/>
  <line x1="579" y1="346" x2="579" y2="588" stroke="#f0d3a1"/>
  <line x1="621" y1="346" x2="621" y2="588" stroke="#f0d3a1"/>
  <line x1="663" y1="346" x2="663" y2="588" stroke="#f0d3a1"/>
  <line x1="705" y1="346" x2="705" y2="588" stroke="#f0d3a1"/>
  <line x1="847" y1="346" x2="847" y2="588" stroke="#d5e0e7"/>
  <text x="103" y="332" class="label">row = (attempt 1, retry 1, retry 2)</text>
  <text x="267" y="332" class="tiny">Q1</text><text x="309" y="332" class="tiny">Q2</text><text x="351" y="332" class="tiny">…</text><text x="393" y="332" class="tiny">Q20</text>
  <text x="475" y="332" class="tiny">Q21</text><text x="517" y="332" class="tiny">Q22</text><text x="559" y="332" class="tiny">…</text><text x="685" y="332" class="tiny">Q30</text>
  <text x="779" y="332" class="tiny">accuracy / cost</text>

  <!-- row labels and illustrative cells -->
  <text x="98" y="374" class="cell">1.5B → 1.5B → 1.5B</text>
  <text x="98" y="416" class="cell">1.5B → 3B → 7B</text>
  <text x="98" y="458" class="cell">3B → 7B → 1.5B</text>
  <text x="98" y="500" class="cell">7B → 7B → 7B</text>
  <text x="98" y="542" class="cell">⋮ 23 more ordered rows</text>
  <text x="98" y="580" class="cell">all rows allow repetition</text>

  <g fill="#bde7d8" stroke="#168f88" stroke-width="1">
    <rect x="257" y="355" width="28" height="24" rx="5"/><rect x="341" y="355" width="28" height="24" rx="5"/><rect x="383" y="355" width="28" height="24" rx="5"/>
    <rect x="257" y="397" width="28" height="24" rx="5"/><rect x="299" y="397" width="28" height="24" rx="5"/><rect x="383" y="397" width="28" height="24" rx="5"/>
    <rect x="299" y="439" width="28" height="24" rx="5"/><rect x="341" y="439" width="28" height="24" rx="5"/>
    <rect x="257" y="481" width="28" height="24" rx="5"/><rect x="341" y="481" width="28" height="24" rx="5"/><rect x="383" y="481" width="28" height="24" rx="5"/>
  </g>
  <g fill="#ffe5b7" stroke="#d58c2b" stroke-width="1">
    <rect x="463" y="355" width="28" height="24" rx="5"/><rect x="547" y="355" width="28" height="24" rx="5"/><rect x="673" y="355" width="28" height="24" rx="5"/>
    <rect x="505" y="397" width="28" height="24" rx="5"/><rect x="631" y="397" width="28" height="24" rx="5"/>
    <rect x="463" y="439" width="28" height="24" rx="5"/><rect x="589" y="439" width="28" height="24" rx="5"/><rect x="673" y="481" width="28" height="24" rx="5"/>
  </g>
  <g class="tiny" text-anchor="middle">
    <text x="271" y="372">1</text><text x="355" y="372">0</text><text x="397" y="372">1</text>
    <text x="271" y="414">0</text><text x="313" y="414">1</text><text x="397" y="414">1</text>
    <text x="313" y="456">1</text><text x="355" y="456">0</text>
    <text x="271" y="498">1</text><text x="355" y="498">1</text><text x="397" y="498">1</text>
  </g>
  <text x="781" y="374" class="tiny">1 / $</text><text x="781" y="416" class="tiny">0 / $</text><text x="781" y="458" class="tiny">1 / $</text><text x="781" y="500" class="tiny">1 / $</text>
  <text x="103" y="620" class="small">A cell records the final answer, whether the verifier stopped early, and the actual input-token cost.</text>
  <text x="103" y="642" class="small">The selector may see green search cells only. Orange audit cells stay hidden until after it recommends a row.</text>

  <!-- Workflow panel -->
  <rect x="965" y="150" width="580" height="510" rx="24" fill="#ffffff" stroke="#d4dfe8" stroke-width="2" filter="url(#shadow)"/>
  <text x="995" y="190" class="panelTitle">One cell: one deployment run</text>
  <text x="995" y="218" class="small">The answer key is never sent to the verifier.</text>

  <rect x="1000" y="255" width="132" height="64" rx="14" fill="#e6f0fa" stroke="#6d99c0" stroke-width="2"/>
  <text x="1066" y="281" text-anchor="middle" class="label">MathQA</text><text x="1066" y="302" text-anchor="middle" class="small">question + options</text>
  <line x1="1133" y1="287" x2="1168" y2="287" stroke="#36506b" stroke-width="3" marker-end="url(#arrow)"/>

  <rect x="1175" y="245" width="145" height="84" rx="14" fill="#d9f1e8" stroke="#168f88" stroke-width="2"/>
  <text x="1247" y="272" text-anchor="middle" class="label">Attempt 1</text><text x="1247" y="296" text-anchor="middle" class="small">solver m₁</text><text x="1247" y="316" text-anchor="middle" class="tiny">input cost counted</text>
  <line x1="1321" y1="287" x2="1356" y2="287" stroke="#36506b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1363" y="245" width="145" height="84" rx="14" fill="#edf3fa" stroke="#6d99c0" stroke-width="2"/>
  <text x="1435" y="272" text-anchor="middle" class="label">Verifier</text><text x="1435" y="296" text-anchor="middle" class="small">PASS or RETRY</text><text x="1435" y="316" text-anchor="middle" class="tiny">no answer key</text>

  <path d="M1435 330 L1435 378 L1250 378 L1250 408" fill="none" stroke="#d58c2b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1346" y="369" class="tiny" fill="#b26d12">RETRY</text>
  <rect x="1175" y="414" width="145" height="72" rx="14" fill="#d9f1e8" stroke="#168f88" stroke-width="2"/>
  <text x="1247" y="441" text-anchor="middle" class="label">Retry 1</text><text x="1247" y="465" text-anchor="middle" class="small">solver m₂</text><text x="1247" y="481" text-anchor="middle" class="tiny">sees prior response</text>
  <line x1="1321" y1="450" x2="1356" y2="450" stroke="#36506b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1363" y="414" width="145" height="72" rx="14" fill="#edf3fa" stroke="#6d99c0" stroke-width="2"/>
  <text x="1435" y="441" text-anchor="middle" class="label">Verifier</text><text x="1435" y="465" text-anchor="middle" class="small">PASS or RETRY</text>

  <path d="M1435 488 L1435 530 L1250 530 L1250 556" fill="none" stroke="#d58c2b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="1346" y="521" class="tiny" fill="#b26d12">RETRY</text>
  <rect x="1175" y="560" width="145" height="64" rx="14" fill="#d9f1e8" stroke="#168f88" stroke-width="2"/>
  <text x="1247" y="587" text-anchor="middle" class="label">Retry 2</text><text x="1247" y="609" text-anchor="middle" class="small">solver m₃</text>
  <line x1="1321" y1="592" x2="1356" y2="592" stroke="#36506b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1363" y="560" width="145" height="64" rx="14" fill="#fff0f0" stroke="#c55b5b" stroke-width="2"/>
  <text x="1435" y="587" text-anchor="middle" class="label">Final score</text><text x="1435" y="609" text-anchor="middle" class="small">answer key only here</text>

  <!-- bottom search loop -->
  <rect x="55" y="705" width="1490" height="220" rx="24" fill="#f4f8fb" stroke="#d4dfe8" stroke-width="2"/>
  <text x="85" y="746" class="panelTitle">Search loop and cost rule</text>
  <rect x="88" y="778" width="250" height="82" rx="14" fill="#e6f0fa" stroke="#6d99c0" stroke-width="2"/>
  <text x="213" y="808" text-anchor="middle" class="label">Choose a row</text><text x="213" y="834" text-anchor="middle" class="small">random / UCB / elimination / BO-style</text>
  <line x1="342" y1="819" x2="395" y2="819" stroke="#36506b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="405" y="778" width="270" height="82" rx="14" fill="#d9f1e8" stroke="#168f88" stroke-width="2"/>
  <text x="540" y="808" text-anchor="middle" class="label">Pull one search cell</text><text x="540" y="834" text-anchor="middle" class="small">run the full retry workflow</text>
  <line x1="679" y1="819" x2="732" y2="819" stroke="#36506b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="742" y="778" width="310" height="82" rx="14" fill="#fff0d9" stroke="#d58c2b" stroke-width="2"/>
  <text x="897" y="808" text-anchor="middle" class="label">Charge the reached calls</text><text x="897" y="834" text-anchor="middle" class="small">coefficient(model) × input tokens</text>
  <line x1="1056" y1="819" x2="1109" y2="819" stroke="#36506b" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="1119" y="778" width="386" height="82" rx="14" fill="#eef2f5" stroke="#7d91a3" stroke-width="2"/>
  <text x="1312" y="808" text-anchor="middle" class="label">Recommend one row</text><text x="1312" y="834" text-anchor="middle" class="small">then score it on the 10 hidden questions</text>

  <text x="90" y="895" class="small">Pilot: 27 rows · 20 search columns · 10 audit columns · test split reserved for a later confirmation run</text>
  <text x="90" y="915" class="small">No output-token charge · no cache discount · verifier cannot see the answer key</text>
</svg>
